<title>Lil Karina</title>
<meta name="description" content="Discover more of Lil Karina.">
<style>
:root{color-scheme:dark;--bg:#08080a;--muted:#aaa;--blue:#00aff0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a{color:inherit}
.hero{height:clamp(310px,92vw,480px);position:relative;overflow:hidden;background:#171717}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 38%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 42%,rgba(8,8,10,.2) 62%,var(--bg) 100%)}
main{max-width:600px;margin:-88px auto 0;position:relative;z-index:1;padding:0 22px 50px;text-align:center}
.avatar{display:block;width:142px;height:142px;object-fit:cover;border-radius:50%;border:5px solid var(--bg);margin:0 auto 22px;background:#222}
h1{font-size:clamp(36px,8vw,48px);line-height:1.12;font-weight:800;letter-spacing:-1.3px;margin:0 0 12px}
.handle{font-size:19px;color:var(--muted);margin:0 0 18px}
.status{font-size:16px;color:#c4c4c8;margin:0 0 32px}
.dot{color:#35d768;font-size:19px;vertical-align:-1px}
.social{display:flex;justify-content:center;margin:0 0 65px}
.social a{width:82px;height:82px;border:1px solid #29292f;border-radius:50%;background:#141418;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s}
.social a:hover{transform:scale(1.04);background:#1c1c22}
.social svg{width:38px;height:38px}
.feature{display:block;position:relative;height:clamp(230px,65vw,330px);border-radius:34px;overflow:hidden;text-decoration:none;text-align:left;border:1px solid #29292f;background:#171717}
.feature>img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block;transition:transform .35s}
.feature:hover>img{transform:scale(1.035)}
.feature:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.03) 20%,rgba(0,0,0,.12) 40%,rgba(0,0,0,.88) 100%)}
.arrow{position:absolute;z-index:1;right:20px;top:20px;width:58px;height:58px;border-radius:50%;background:rgba(10,10,12,.48);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:39px;font-weight:300;backdrop-filter:blur(8px)}
.feature-copy{position:absolute;z-index:1;left:24px;right:24px;bottom:24px}
.feature-label{font-size:13px;color:#d0d0d0;text-transform:uppercase;letter-spacing:1.8px;margin-bottom:8px}
.feature-title{font-size:27px;font-weight:750;margin-bottom:6px}
.feature-sub{font-size:15px;color:#ddd}
.footer{color:#626268;font-size:12px;margin-top:35px}
@media(max-width:380px){main{padding-left:17px;padding-right:17px}.avatar{width:128px;height:128px}.social{margin-bottom:48px}.feature{border-radius:27px}}
</style>
</head>
<body>
